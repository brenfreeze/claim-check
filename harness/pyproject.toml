requires-python = ">=3.12"
dependencies = [
    "decima-ai==2.2.0",
    "onnxruntime==1.24.*",
]

[dependency-groups]
train = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "onnx>=1.23.2",
    "sacremoses>=0.2.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
]
